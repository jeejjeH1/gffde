<!doctype html>
<meta charset="utf-8">
<title>Ollama X Reply</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; color: #111; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  input[type=text], input[type=number], textarea, select { width: 100%; box-sizing: border-box; padding: 6px 8px; }
  textarea { min-height: 54px; }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }
  button { padding: 6px 12px; margin: 10px 6px 0 0; cursor: pointer; }
  #status { margin-top: 12px; min-height: 1.2em; }
  fieldset { margin-top: 18px; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } input, textarea, select { background: #222; color: #eee; border: 1px solid #444; } }
</style>
<h1>Ollama X Reply</h1>
<fieldset>
  <legend>Ollama</legend>
  <label for="baseUrl">Base URL</label>
  <input id="baseUrl" type="text">
  <label for="model">Model</label>
  <input id="model" type="text" list="models">
  <datalist id="models"></datalist>
  <div class="row">
    <div><label for="temperature">Temperature</label><input id="temperature" type="number" step="0.05" min="0" max="2"></div>
    <div><label for="maxTokens">Max tokens</label><input id="maxTokens" type="number" min="16" max="1024"></div>
  </div>
  <button id="refresh">Load installed models</button>
  <button id="test">Test connection</button>
  <p>If you see 403 errors, run Ollama with <code>OLLAMA_ORIGINS=chrome-extension://*</code>. Default localhost:11434 is handled automatically.</p>
</fieldset>
<fieldset>
  <legend>Profile</legend>
  <label for="profile">Active profile</label>
  <select id="profile"></select>
  <label for="pname">Name</label><input id="pname" type="text">
  <label for="pprompt">Identity</label><textarea id="pprompt"></textarea>
  <label for="pstyle">Style</label><textarea id="pstyle"></textarea>
  <label for="pavoid">Avoid</label><textarea id="pavoid"></textarea>
  <div class="row">
    <div><label for="pmin">Min words</label><input id="pmin" type="number" min="1"></div>
    <div><label for="pmax">Max words</label><input id="pmax" type="number" min="1"></div>
    <div><label for="pq">Questions</label>
      <select id="pq"><option>never</option><option>rarely</option><option>occasionally</option><option>often</option></select></div>
  </div>
  <label><input id="pemoji" type="checkbox"> Allow emojis</label>
  <button id="add">New profile</button>
  <button id="del">Delete profile</button>
</fieldset>
<fieldset>
  <legend>Posting</legend>
  <label><input id="autoPost" type="checkbox"> Post automatically after inserting the reply (off = you review and press Post)</label>
</fieldset>
<button id="save">Save</button>
<div id="status"></div>
<script src="lib.js"></script>
<script src="options.js"></script>
